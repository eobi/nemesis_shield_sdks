name = "nemesis-supabase-proxy"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Your real Supabase project URL (not secret).
[vars]
SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
# NEMESIS_ENDPOINT is optional; defaults to https://shield.nemesislabs.xyz/api/v1/sketches

# The app install token is a SECRET — set it with:
#   npx wrangler secret put NEMESIS_TOKEN
