[package]
name = "nemesis-shield"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Nemesis Shield — Sentinel SDK for Rust: learns your app's normal behavior and blocks off-baseline requests (positive-security, fail-open)."
repository = "https://github.com/eobi/nemesis_shield_sdks"
readme = "README.md"
keywords = ["security", "waf", "rasp", "runtime", "appsec"]
categories = ["web-programming", "authentication"]

[dependencies]
ureq = "2"
serde_json = "1"
ed25519-dalek = "2"        # verify the Ed25519 signature over pulled model bundles
base64 = "0.22"            # decode the model signature header
